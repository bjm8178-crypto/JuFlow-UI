<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bc5125">
<title>Sell dishes · JuFlow Cashier</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="app-page pos">

<form id="login" class="app-card login-card" hidden>
  <a class="brand" href="/cashier/"><span class="brand-mark">J<span>•</span></span><span>JuFlow<span class="brand-sub">CASHIER</span></span></a>
  <h2>Cashier sign in</h2>
  <input id="u" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
  <input id="p" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
  <button class="primary full">Sign in</button>
  <p id="le" class="status-msg error" role="alert"></p>
</form>

<div id="app" hidden>
  <header class="app-bar">
    <span class="brand-mark">J<span>•</span></span>
    <div class="app-title"><strong>Sell dishes</strong><small>Today’s menu</small></div>
    <span id="net" class="pill"></span>
    <button class="icon-button" id="out" type="button" aria-label="Log out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H4v16h6m3-12 4 4-4 4m-5-4h13"/></svg></button>
  </header>

  <main class="pos-main">
    <div id="menu"></div>
    <aside id="cart">
      <h2>Current order</h2>
      <div id="lines"></div>
      <div class="cart-total"><span>Total</span><span id="tot">₱0.00</span></div>
      <label for="pay">Payment</label>
      <select id="pay"><option value="exact">Cash exact</option><option value="cash">Cash with change</option><option value="gcash">GCash</option></select>
      <input id="tend" type="number" step="0.01" inputmode="decimal" placeholder="Cash received (₱)" aria-label="Cash received" hidden>
      <input id="ref" placeholder="GCash reference" aria-label="GCash reference" hidden>
      <button class="primary" id="apply">Record sale</button>
      <p id="msg" class="status-msg" role="status"></p>
    </aside>
  </main>

  <div class="checkout-bar"><div><strong id="bar-count">0 items</strong><span id="bar-total">₱0.00</span></div><a href="#cart">Review order</a></div>

  <nav class="tabbar" aria-label="Cashier">
    <a href="/cashier.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12h6M9 16h4"/></svg>Queue</a>
    <a class="active" aria-current="page" href="/cashier/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Sell dishes</a>
  </nav>
</div>

<script>
const $=id=>document.getElementById(id),peso=c=>'₱'+(c/100).toFixed(2);let dishes=[],qty={},tx=crypto.randomUUID();
const api=async(u,o={})=>{const r=await fetch('/api'+u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.message||r.status);e.status=r.status;throw e}return d};
const queue=()=>JSON.parse(localStorage.getItem('pending_sales')||'[]'),setQ=q=>localStorage.setItem('pending_sales',JSON.stringify(q));
const say=(t,err)=>{const m=$('msg');m.textContent=t;m.classList.toggle('error',!!err)};
async function flush(){const q=queue(),left=[];for(const s of q){try{await api('/sales',{method:'POST',body:JSON.stringify(s)})}catch(e){if(!(e.status>=400&&e.status<500&&e.status!==401&&e.status!==429)&&e.status!==409)left.push(s)}}setQ(left);$('net').textContent=left.length?left.length+' unsent':'● online'}
function total(){return dishes.reduce((s,d)=>s+(qty[d._id]||0)*d.price_centavos,0)}
function draw(){const M=$('menu');M.textContent='';dishes.forEach(d=>{const c=document.createElement('div');c.className='dish'+(qty[d._id]?' on':'');
c.append(d.photo_path?Object.assign(document.createElement('img'),{src:d.photo_path,alt:''}):Object.assign(document.createElement('div'),{className:'ph'}));
const t=document.createElement('div');t.className='dish-name';t.textContent=d.name;const p=document.createElement('div');p.className='dish-price';p.textContent=peso(d.price_centavos);
const q=document.createElement('div');q.className='q';const m=Object.assign(document.createElement('button'),{type:'button',textContent:'−'}),n=document.createElement('strong'),a=Object.assign(document.createElement('button'),{type:'button',textContent:'+'});
m.setAttribute('aria-label','Remove one '+d.name);a.setAttribute('aria-label','Add one '+d.name);
n.textContent=qty[d._id]||0;m.onclick=()=>{qty[d._id]=Math.max(0,(qty[d._id]||0)-1);draw()};a.onclick=()=>{qty[d._id]=Math.min(99,(qty[d._id]||0)+1);draw()};q.append(m,n,a);c.append(t,p,q);M.append(c)});
const L=$('lines');L.textContent='';const picked=dishes.filter(d=>qty[d._id]);
if(!picked.length){const e=document.createElement('p');e.className='cart-empty';e.textContent='Tap + on a dish to start an order.';L.append(e)}
picked.forEach(d=>{const l=document.createElement('div');l.className='line';l.textContent=`${qty[d._id]} × ${d.name}`;const s=document.createElement('span');s.textContent=peso(qty[d._id]*d.price_centavos);l.append(s);L.append(l)});
const count=picked.reduce((s,d)=>s+qty[d._id],0);$('tot').textContent=peso(total());$('bar-count').textContent=count+(count===1?' item':' items');$('bar-total').textContent=peso(total());document.body.classList.toggle('has-order',count>0)}
$('pay').onchange=()=>{$('tend').hidden=$('pay').value!=='cash';$('ref').hidden=$('pay').value!=='gcash'};
$('apply').onclick=async()=>{const items=dishes.filter(d=>qty[d._id]).map(d=>({product_id:d._id,name:d.name,quantity:qty[d._id],price_centavos:d.price_centavos}));
if(!items.length){say('Add at least one dish.',true);return}
const sale={transaction_id:tx,items,total_centavos:total(),payment_method:$('pay').value};
if(sale.payment_method==='cash'){sale.cash_tendered_centavos=Math.round(parseFloat($('tend').value||0)*100)}
if(sale.payment_method==='gcash')sale.gcash_reference=$('ref').value;
$('apply').disabled=true;try{await api('/sales',{method:'POST',body:JSON.stringify(sale)});say('Sale recorded ✓')}
catch(e){if(e.status>=400&&e.status<500&&e.status!==401&&e.status!==429){say(e.message,true);$('apply').disabled=false;return}
setQ([...queue(),sale]);say('No connection — saved, will retry automatically.')}
qty={};tx=crypto.randomUUID();$('tend').value='';$('ref').value='';$('apply').disabled=false;draw();flush()};
async function start(){let me;try{me=(await api('/auth/me')).user}catch{$('login').hidden=false;$('app').hidden=true;return}
if(!['cashier','admin'].includes(me.role_name)){$('le').textContent='This account cannot use the cashier app.';$('login').hidden=false;return}
$('login').hidden=true;$('app').hidden=false;
try{dishes=(await api('/menu/today')).dishes}catch(e){say(e.message,true)}
if(!dishes.length)say("No dishes set for today. Ask the admin to choose today's menu.",true);draw();flush();setInterval(flush,15000)}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});$('p').value='';$('le').textContent='';start()}catch(er){$('le').textContent=er.message}};
$('out').onclick=async()=>{await api('/auth/logout',{method:'POST'}).catch(()=>{});location.reload()};
start();
</script>
</body>
</html>
