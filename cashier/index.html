<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bc5125">
<meta name="description" content="JuFlow Cashier - point of sale and order management">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JuFlow Cashier">
<link rel="manifest" href="/cashier/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/cashier-192.png">
<link rel="apple-touch-icon" href="/icons/cashier-192.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/cashier/cashier.css">
<title>JuFlow Cashier</title>
</head>
<body class="app-page cashier-app">

<!-- Loading -->
<div id="connecting-screen" class="app-card connecting">
  <div class="brand-mark">J<span>•</span></div>
  <h2>Connecting…</h2>
  <div class="spinner"></div>
</div>

<!-- Sign in -->
<form id="login-screen" class="app-card login-card" hidden>
  <a class="brand" href="/cashier/"><span class="brand-mark">J<span>•</span></span><span>JuFlow<span class="brand-sub">Cashier</span></span></a>
  <h2>Cashier sign in</h2>
  <input id="login-username" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
  <button id="login-submit" class="app-btn primary full large" type="submit">Sign in</button>
  <p id="login-error" class="status-msg error" role="alert"></p>
  <button type="button" id="install-prompt-btn" class="app-btn secondary full" hidden>Install the Cashier app</button>
</form>

<!-- App -->
<div id="app-shell" hidden>
  <header class="app-bar">
    <span class="brand-mark">J<span>•</span></span>
    <div class="app-title">
      <strong id="header-title">Sell</strong>
      <small id="header-subtitle">JuFlow</small>
    </div>
    <span id="connectivity-status" class="pill"></span>
    <button class="icon-button" id="refresh-btn" type="button" aria-label="Refresh this screen">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <main id="app-main" class="app-main"></main>

  <div id="checkout-bar" hidden></div>

  <nav class="tabbar" id="bottom-nav" aria-label="Cashier">
    <a href="#/sell" data-route="sell">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      Sell
    </a>
    <a href="#/orders" data-route="orders">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12h6M9 16h4"/></svg>
      Orders<span class="tab-badge" hidden></span>
    </a>
    <a href="#/new-order" data-route="new-order">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New
    </a>
    <a href="#/today" data-route="today">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Today
    </a>
    <a href="#/me" data-route="me">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Me<span class="tab-badge" hidden></span>
    </a>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="/cashier/app.js"></script>
<script src="/cashier/pos.js"></script>
<script src="/cashier/orders.js"></script>
<script src="/cashier/new-order.js"></script>
<script src="/cashier/today.js"></script>
<script src="/cashier/me.js"></script>
<script src="/cashier/boot.js"></script>
</body>
</html>
