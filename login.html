<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · JuFlow</title>
    <meta name="description" content="Sign in to JuFlow — Ju Kitchen Operations Management System">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-message {
            display: none;
            background: var(--orange-soft);
            border: 1px solid #f0cdb4;
            color: #a52c23;
            padding: 11px 13px;
            border-radius: 7px;
            font-size: 12px;
            line-height: 1.5;
        }
        .error-message.visible { display: block; }
        .auth-form .primary { margin-top: 26px; }
        .primary:disabled { opacity: .65; cursor: not-allowed; filter: none; }
        .auth-form .form-note { text-align: center; margin: 22px 0 0; }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, .75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay.visible { display: flex; }
        .spinner {
            border: 3px solid var(--orange-soft);
            border-top-color: var(--orange);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    </style>
</head>
<body class="auth-page">
    <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
        <div class="spinner"></div>
    </div>

    <header class="auth-brand">
        <a class="brand" href="index.html">
            <span class="brand-mark">J<span>•</span></span>
            <span>JuFlow<span class="brand-sub">JU KITCHEN OPERATIONS</span></span>
        </a>
    </header>

    <div class="auth-layout">
        <aside class="auth-story">
            <span class="eyebrow">KITCHEN OPERATIONS SYSTEM</span>
            <h2>Good food.<br>Smoother operations.</h2>
            <p>Manage your deliveries, team, and orders in one place.</p>
            <div class="story-footer"><span class="little-line"></span>Ju Kitchen</div>
        </aside>

        <main class="auth-main">
            <div class="auth-form">
                <span class="eyebrow">SIGN IN</span>
                <h1>Welcome back</h1>
                <p class="sub">Sign in to manage Ju Kitchen</p>

                <div id="errorMessage" class="error-message" role="alert"></div>

                <form id="loginForm">
                    <label for="username">Username or email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="you@jukitchen.com"
                        required
                        autofocus
                        autocomplete="username" autocapitalize="none" spellcheck="false"
                    >

                    <label for="password">Password</label>
                    <div class="password">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="eye" id="togglePassword" aria-label="Show password" aria-pressed="false">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="primary full"><span>Sign in</span></button>
                </form>

                <p class="form-note">Accounts are created by your administrator.</p>
            </div>
        </main>
    </div>

    <script src="/api.js"></script>
    <script>
        function safeNext(value, user) {
            const fallback = JuAPI.defaultRoute(user);
            if (!value || !value.startsWith('/') || value.startsWith('//') || /[\\\u0000-\u0020\u007f]/.test(value)) return fallback;
            try {
                const target = new URL(value, location.origin);
                return target.origin === location.origin && target.pathname !== '/login.html' && JuAPI.canAccess(target.pathname, user) ? target.pathname + target.search + target.hash : fallback;
            } catch (_) { return fallback; }
        }
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            togglePassword.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            togglePassword.setAttribute('aria-pressed', String(show));
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = loginForm.querySelector('[type="submit"]');
            const label = button.querySelector('span');
            if (button.disabled) return;
            button.disabled = true;
            label.textContent = 'Signing in…';
            errorMessage.classList.remove('visible');
            loadingOverlay.classList.add('visible');
            try {
                const result = await JuAPI.login(document.getElementById('username').value.trim(), passwordInput.value);
                const user = result.user || result;
                if (!['admin', 'cashier', 'rider'].includes(user?.role_name)) throw new Error('Access denied. Unsupported account role.');
                location.replace(safeNext(new URLSearchParams(location.search).get('next'), user));
            } catch (error) {
                errorMessage.textContent = error.status === 429 || ['locked', 'account_locked', 'too_many_requests'].includes(error.code)
                    ? 'Too many attempts. Please try again later.'
                    : error.status === 401 ? 'Invalid username/email or password.'
                    : error.status === 403 ? 'Access denied. Your account cannot sign in.' : error.message;
                errorMessage.classList.add('visible');
                passwordInput.select();
            } finally {
                button.disabled = false;
                label.textContent = 'Sign in';
                loadingOverlay.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
