<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · JuFlow</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay.visible {
            display: flex;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="auth-page">
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <header class="auth-brand">
        <a class="brand" href="index.html">
            <span class="brand-mark">J<span>•</span></span>
            <span>JuFlow<span class="brand-sub">JU KITCHEN OPERATIONS</span></span>
        </a>
    </header>

    <main class="auth-layout">
        <aside class="auth-story">
            <span class="eyebrow">KITCHEN OPERATIONS SYSTEM</span>
            <h2>Good food.<br>Smoother operations.</h2>
            <p>Manage your deliveries, team, and orders in one place.</p>
        </aside>

        <section class="auth-content">
            <div class="form-container">
                <h1>Welcome back</h1>
                <p class="text-muted">Sign in to manage Ju Kitchen</p>

                <div id="errorMessage" class="error-message" role="alert"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Email address</label>
                        <input 
                            type="email" 
                            id="username" 
                            name="email"
                            required 
                            autofocus
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Sign in
                    </button>
                </form>

                <p>First time here? <a href="signup.html">Create an account</a></p>
            </div>
        </section>
    </main>

    <script>
        function safeNext(value) {
            if (!value || !value.startsWith('/') || value.startsWith('//') || /[\\\u0000-\u0020\u007f]/.test(value)) return '/index.html';
            try {
                const target = new URL(value, location.origin);
                return target.origin === location.origin ? target.pathname + target.search + target.hash : '/index.html';
            } catch (_) { return '/index.html'; }
        }
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = loginForm.querySelector('[type="submit"]');
            if (button.disabled) return;
            button.disabled = true;
            errorMessage.classList.remove('visible');
            loadingOverlay.classList.add('visible');
            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
                });
                if (r.ok) {
                    location.replace(safeNext(new URLSearchParams(location.search).get('next')));
                } else {
                    const data = await r.json();
                    errorMessage.textContent = data.error === 'locked' ? 'Too many attempts. Try again in 5 minutes.' : 'Invalid email or password.';
                    errorMessage.classList.add('visible');
                }
            } catch (_) {
                errorMessage.textContent = 'Cannot connect to the server. Please try again.';
                errorMessage.classList.add('visible');
            } finally {
                button.disabled = false;
                loadingOverlay.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
