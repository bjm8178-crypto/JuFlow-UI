<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#39735b">
<meta name="description" content="Juki Rider - Delivery management and navigation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/rider-192.png">
<link rel="apple-touch-icon" href="/icons/rider-192.png">
<link rel="stylesheet" href="/shared/styles.css">
<title>Juki Rider</title>
</head>
<body class="app-page rider-app">

<!-- App Shell -->
<div id="app-shell" style="display:none;">
  <header class="app-bar">
    <span class="brand-mark rider-mark">J<span>•</span></span>
    <div class="app-title">
      <strong id="header-title">Rider</strong>
      <small id="header-subtitle">Juki</small>
    </div>
    <span id="connectivity-status" class="pill"></span>
    <button class="icon-button" id="refresh-btn" type="button" aria-label="Refresh">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
      </svg>
    </button>
  </header>

  <main id="app-main" class="app-main">
    <!-- Dynamic content loads here via hash routing -->
  </main>

  <nav class="tabbar rider-tabbar" id="bottom-nav">
    <a href="#/jobs" data-route="jobs" class="active">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12h6M9 16h4"/>
      </svg>
      Jobs
    </a>
    <a href="#/history" data-route="history">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      History
    </a>
    <a href="#/me" data-route="me">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Me
    </a>
  </nav>
</div>

<!-- Login Screen (in-scope) -->
<form id="login-screen" class="app-card login-card" style="display:none;">
  <a class="brand" href="/rider/">
    <span class="brand-mark rider-mark">J<span>•</span></span>
    <span>Juki<span class="brand-sub">Rider</span></span>
  </a>
  <h2>Rider sign in</h2>
  <input id="login-username" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
  <button class="app-btn primary full large" type="submit">Sign in</button>
  <p id="login-error" class="status-msg error" role="alert"></p>
  <button type="button" id="install-prompt-btn" class="app-btn secondary full" style="display:none;">
    Install the Rider app
  </button>
</form>

<!-- Loading/Connecting State -->
<div id="connecting-screen" class="app-card connecting">
  <div class="brand-mark rider-mark">J<span>•</span></div>
  <h2>Connecting…</h2>
  <p class="muted">Loading Juki Rider</p>
  <div class="spinner"></div>
</div>

<script defer src="/rider/app.js"></script>
<script defer src="/rider/pin.js"></script>
<script defer src="/rider/jobs.js"></script>
<script defer src="/rider/history.js"></script>
<script defer src="/rider/me.js"></script>

</body>
</html>
