# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: juflow-api            # URL becomes https://juflow-api.onrender.com (update vercel.json if Render adds a suffix)
    runtime: node
    rootDir: server
    region: singapore           # closest Render region to the Philippines
    plan: free                  # free instances sleep after ~15 min idle; use "starter" for always-on
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Manila
      - key: DB_NAME
        value: juflow
      - key: TRUST_PROXY          # Vercel rewrite + Render proxy = 2 hops
        value: "2"
      - key: DATABASE_URL         # PostgreSQL connection string (Supabase, Neon, or Render Postgres)
        sync: false
      - key: MONGODB_URI          # MongoDB Atlas connection string (fallback if DATABASE_URL is not set)
        sync: false
      - key: CORS_ORIGINS         # your Vercel URL, e.g. https://juflow.vercel.app (no trailing slash)
        sync: false
      - key: ADMIN_USERNAME       # first admin; only used when no admin exists yet
        sync: false
      - key: ADMIN_PASSWORD       # min 8 chars; delete this variable after the first successful boot
        sync: false
      - key: RIDER_USERNAME
        sync: false
      - key: RIDER_PASSWORD
        sync: false
      - key: CASHIER_API_TOKEN    # generated by Render; copy it into the cashier device
        generateValue: true
      - key: GROQ_API_KEY         # admin AI assistant (console.groq.com); never commit this value
        sync: false
      - key: GROQ_MODEL           # optional, default llama-3.3-70b-versatile
        sync: false
