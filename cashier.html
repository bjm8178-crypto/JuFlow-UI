<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bc5125">
<title>Cashier | JuFlow</title>
<link rel="stylesheet" href="styles.css">
<script src="api.js"></script>
<script src="auth-guard.js"></script>
<script src="outbox.js" defer></script>
<script src="cashier.js" defer></script>
</head>
<body class="app-page">
<header class="app-bar">
  <span class="brand-mark">J<span>•</span></span>
  <div class="app-title"><strong>Order queue</strong><small id="who">Cashier</small></div>
  <button class="icon-button" id="refresh" type="button" aria-label="Refresh queue"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
  <button class="icon-button" id="signout" type="button" aria-label="Sign out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H4v16h6m3-12 4 4-4 4m-5-4h13"/></svg></button>
</header>

<main class="app-main">
  <p id="status" class="app-status" role="status" aria-live="polite">Checking session...</p>

  <div class="app-section"><h2>Kitchen &amp; rider handover</h2><p class="app-hint">Start preparing, mark orders ready, then assign a rider.</p></div>
  <section id="orders" class="job-list" aria-label="Active orders"></section>

  <div class="app-section"><h2>Payment confirmation</h2><p class="app-hint">Verify the payment yourself before recording the final confirmation.</p></div>
  <section id="confirmations" class="job-list" aria-label="Awaiting payment confirmation"></section>
</main>

<nav class="tabbar" aria-label="Cashier">
  <a class="active" aria-current="page" href="/cashier.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12h6M9 16h4"/></svg>Queue</a>
  <a href="/cashier/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Sell dishes</a>
</nav>

<script>
JUFLOW_AUTH_READY.then(u => { if (u) document.getElementById('who').textContent = (u.full_name || u.username || 'Cashier') + ' · Cashier'; }).catch(() => {});
</script>
</body>
</html>
